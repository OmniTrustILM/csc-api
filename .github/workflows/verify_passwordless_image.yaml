name: Verify passwordless image

# The runtime image runs a jlink-trimmed JRE, so a module the Azure SDK resolves reflectively
# can go missing without any test noticing. Only an image or dependency change can cause that.
on:
  pull_request:
    branches: [ main*, feat/*, hotfix/* ]
    paths:
      - 'Dockerfile'
      - 'pom.xml'
      - 'scripts/verify-passwordless-image.sh'
      - '.github/workflows/verify_passwordless_image.yaml'
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-passwordless-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify passwordless classes resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t csc-api:passwordless-check .
      - name: Verify
        run: ./scripts/verify-passwordless-image.sh csc-api:passwordless-check
